name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e "python[cache,dev]"
      - name: generate gRPC stubs
        run: python scripts/gen_proto.py
      - name: unit tests (cache tier, table service, dataset server, fetch, contract compatibility)
        run: python -m pytest python/tests
      - name: benchmark harness tests
        run: python -m pytest bench

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: protoc and plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: generate and test
        working-directory: go
        run: |
          sh gen.sh
          go vet ./...
          go test ./...

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: test
        working-directory: java
        run: ./gradlew --no-daemon test

  # Builds the three dataset images, starts the stack on the synthetic fixture
  # and runs the integration tests, which include the conformance tool replaying
  # every key against the Python, Java and Go replicas and failing on any
  # difference.
  stack:
    runs-on: ubuntu-latest
    needs: [python, go, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "python[cache,dev]"
      - run: python scripts/gen_proto.py
      - name: integration tests
        run: RLS_INTEGRATION=1 python -m pytest python/tests/integration -v
